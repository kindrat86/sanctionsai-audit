<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>404 — nothing here · SanctionsAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#050505;--ink:#f5f5f4;--ink-dim:#a8a29e;--ink-faint:#57534e;--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.14);--accent:#a3e635;--accent-2:#22d3ee;--danger:#f87171;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,sans-serif;font-weight:400;line-height:1.5;letter-spacing:-.011em;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center}
.mesh{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.mesh::before,.mesh::after{content:"";position:absolute;border-radius:50%;filter:blur(120px);opacity:.24}
.mesh::before{width:50vw;height:50vw;left:-10vw;top:-5vh;background:radial-gradient(circle,rgba(248,113,113,.4),transparent 60%)}
.mesh::after{width:45vw;height:45vw;right:-10vw;bottom:0;background:radial-gradient(circle,rgba(163,230,53,.35),transparent 60%)}
.mono{font-family:'Geist Mono',monospace;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}

.card{text-align:center;padding:2.5rem 2rem;max-width:34rem;margin:0 1.5rem}
.code{font-family:'Geist Mono',monospace;font-size:clamp(5rem,15vw,9rem);font-weight:600;letter-spacing:-.05em;color:var(--ink);opacity:.12;margin-bottom:-2rem;user-select:none;line-height:1}
h1{font-size:clamp(1.4rem,2.5vw,2rem);font-weight:600;letter-spacing:-.025em;margin-bottom:.75rem}
p{color:var(--ink-dim);font-size:1rem;margin-bottom:2rem}
.btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 1.3rem;border-radius:999px;font-weight:600;font-size:.93rem;letter-spacing:-.01em;border:none;cursor:pointer;font-family:inherit;transition:transform .4s var(--ease)}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line-strong)}
.btn-ghost:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28)}
.micro{margin-top:1.5rem;font-size:.78rem;color:var(--ink-faint);font-family:'Geist Mono',monospace}
.micro a{color:var(--accent-2)}
</style>
</head>
<body>
<div class="mesh"></div>
<div class="card">
  <div class="code">404</div>
  <h1>Nothing at this address.</h1>
  <p>Like a wallet without a screening check — you're somewhere the rails don't go. Let's get you back to the part that matters.</p>
  <div class="btns">
    <a class="btn btn-primary" href="/">Start fresh →</a>
    <a class="btn btn-ghost" href="/check">Screen a wallet</a>
  </div>
  <div class="micro">If you typed a URL manually — double-check it. If you followed a link here, <a href="mailto:hello@sanctionsai.dev">let us know</a>.</div>
</div>
<script src="/analytics.js" defer></script>
</body>
</html>
